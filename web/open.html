<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open a conference</title>
<main>
  <h1>Open a conference</h1>
  <label for="invite">Meeting invitation</label>
  <input id="invite" type="url" autocomplete="off" size="50" placeholder="Meeting invitation URL">
  <button id="open" type="button">Open in Conference Guest</button>
  <p id="status" role="status"></p>
</main>
<script>
  const input = document.getElementById('invite');
  const status = document.getElementById('status');
  document.getElementById('open').addEventListener('click', () => {
    try {
      const invite = new URL(input.value);
      const segments = invite.pathname.split('/').filter(Boolean);
      if (invite.protocol !== 'https:' || !invite.hostname ||
          invite.username || invite.password ||
          segments.length !== 2 || segments[0] !== 'calls' ||
          !segments[1] || !invite.searchParams.get('psw')) {
        throw new Error('Enter a complete HTTPS meeting invitation.');
      }
      const appLink = new URL('conferenceguest://join');
      appLink.searchParams.set('url', invite.href);
      window.location.assign(appLink.href);
      status.textContent = 'If the app did not open, install it or paste this link in the app.';
    } catch (error) {
      status.textContent = error.message;
    }
  });
</script>
</html>
