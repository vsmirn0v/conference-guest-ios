<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Open a jam</title>
<main>
  <h1>Open a jam</h1>
  <label for="invite">Jam invitation</label>
  <input id="invite" type="url" autocomplete="off" size="50" placeholder="Jam invitation URL">
  <button id="open" type="button">Open in Rock’n’Roll</button>
  <p id="status" role="status"></p>
</main>
<script>
  const input = document.getElementById('invite');
  const status = document.getElementById('status');
  const supplied = new URL(location.href).searchParams.getAll('url');
  if (supplied.length === 1) input.value = supplied[0];
  document.getElementById('open').addEventListener('click', () => {
    try {
      const invite = new URL(input.value);
      const segments = invite.pathname.split('/').filter(Boolean);
      const isRockJam = invite.hostname === 'rock.glowsoft.ru' &&
          segments.length === 2 && segments[0] === 'jams' && segments[1] === 'test' &&
          !invite.search && !invite.hash;
      const passwords = invite.searchParams.getAll('psw');
      const isGuestInvitation = segments.length === 2 && segments[0] === 'calls' &&
          segments[1] && passwords.length === 1 && passwords[0];
      if (invite.protocol !== 'https:' || !invite.hostname ||
          invite.username || invite.password || !(isRockJam || isGuestInvitation)) {
        throw new Error('Enter a supported HTTPS jam invitation.');
      }
      const appLink = new URL('conferenceguest://join');
      appLink.searchParams.set('url', invite.href);
      window.location.assign(appLink.href);
      status.textContent = 'If the app did not open, install it or paste this link in the app.';
    } catch (error) {
      status.textContent = error.message;
    }
  });
</script>
</html>
