<style>
#portrait-share-full { padding: 14px 4px; }
#portrait-share-full .phone {
  width: min(100%, 352px); aspect-ratio: 589/1280; margin: 0 auto; position: relative;
  overflow: hidden; isolation: isolate; container-type: inline-size; border-radius: 36px;
  color: #f8f8fa; background: #000; box-shadow: 0 0 0 1px #49494d, 0 8px 32px #0003;
  font: 15px/1.2 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; color-scheme: dark;
}
#portrait-share-full .phone * { box-sizing: border-box; }
#portrait-share-full .status { display:flex; align-items:center; justify-content:space-between;
  padding: 0 23px; height: 45px; font-size: 13px; font-weight: 650; }
#portrait-share-full .island { position:absolute; top:8px; left:50%; transform:translateX(-50%);
  width: 92px; height: 25px; background:#080808; border:1px solid #242428; border-radius:20px; }
#portrait-share-full .signal { display:flex; align-items:center; gap:3px; font-size:11px; }
#portrait-share-full .signal svg { width:14px; height:14px; }
#portrait-share-full .battery { border:1px solid #bbb; background:linear-gradient(to right,#ddd 80%,transparent 80%);
  color:#000; font-size:9px; padding:0 3px; border-radius:3px; }
#portrait-share-full .header { position:relative; z-index:2; display:grid; align-items:center;
  grid-template-columns:44px minmax(0,1fr) 44px; gap:5px; margin:5px 9px; }
#portrait-share-full .glass { background: linear-gradient(155deg,#2a2a2d,#1e1e21 65%,#252528);
  border:1px solid #3a3a3f; box-shadow:inset 0 1px 0 #ffffff08; }
#portrait-share-full button { font:inherit; color:inherit; }
#portrait-share-full .round { display:grid; place-items:center; height:44px; border-radius:50%; }
#portrait-share-full .round svg { width:20px; height:20px; }
#portrait-share-full .identity { display:flex; align-items:center; justify-content:space-between; gap:4px;
  min-width:0; min-height:48px; padding:5px 10px 5px 13px; border-radius:22px; text-align:left; }
#portrait-share-full .lines { min-width:0; }
#portrait-share-full .meeting { display:block; font-size:14px; font-weight:620; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#portrait-share-full .speaker { display:flex; align-items:center; gap:5px; margin-top:3px; font-size:12px; color:#e2e2e7; }
#portrait-share-full .speaker svg { width:13px; height:13px; color:#76dc97; }
#portrait-share-full .disclose { width:12px; height:12px; flex:none; color:#aaaab1; }
#portrait-share-full .screen { position:absolute; top:50%; left:0; width:100%; aspect-ratio:589/217;
  transform:translateY(-50%); overflow:hidden; background:#1d2329; }
#portrait-share-full .screen img { width:100%; height:100%; display:block; object-fit:cover; object-position:center; }
#portrait-share-full .bottom { position:absolute; bottom:28px; width:100%; padding:0 6px; display:grid; gap:7px; }
#portrait-share-full .tools { display:flex; justify-self:end; align-items:center; border-radius:24px; overflow:hidden; padding:0 3px; }
#portrait-share-full .tool { display:flex; align-items:center; justify-content:center; gap:4px;
  min-width:44px; min-height:44px; border:0; background:transparent; padding:0 8px; font-size:13px; }
#portrait-share-full .tools .chev { width:11px; }
#portrait-share-full .tool svg { width:18px; height:18px; }
#portrait-share-full .divider { width:1px; height:16px; background:#55555b; }
#portrait-share-full .dock { display:grid; grid-template-columns:repeat(6,minmax(0,1fr));
  align-items:center; padding:5px 1px; border-radius:22px; }
#portrait-share-full .action { display:grid; justify-items:center; align-content:center; min-height:49px;
  gap:6px; font-size:11px; font-weight:500; color:#ececf1; }
#portrait-share-full .action svg { width:20px; height:20px; }
#portrait-share-full .leave { color:#ff6769; border-left:1px solid #ffffff18; }
#portrait-share-full .home { position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  width:100px; height:4px; border-radius:4px; background:#e7e7e9; }
#portrait-share-full .panel { position:absolute; z-index:3; left:10px; right:10px; bottom:141px;
  padding:13px 16px 8px; border:1px solid #46464a; background:#242426; border-radius:20px;
  box-shadow:0 8px 28px #0009; }
#portrait-share-full .panel[data-panel="details"] { bottom:auto; top:105px; }
#portrait-share-full .panel header { display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:620; }
#portrait-share-full .close { display:grid; place-items:center; width:44px; height:44px; border:0; background:transparent; }
#portrait-share-full .close svg { width:18px; }
#portrait-share-full .row { display:flex; justify-content:space-between; align-items:center; gap:12px;
  min-height:42px; font-size:13px; border-top:1px solid #ffffff13; }
#portrait-share-full .row span { color:#c9c9ce; }
#portrait-share-full .row b { text-align:right; font-weight:500; }
#portrait-share-full [hidden] { display:none; }
</style>

<script>
(() => {
  const root = document.getElementById('portrait-share-full');
  const panel = root.querySelector('.panel');
  const close = panel.querySelector('.close');
  const contents = {
    details: ['Engineering design review', [['Speaking','Alex Morgan'],['Sharing screen','Sam Rivera']]],
    view: ['View', [['Layout','Focus'],['Receive video','Screen sharing only'],['Shared screen','Fit / Fill']]],
    more: ['More', [['Participants',''],['Meeting assistant',''],['Switch meeting','']]]
  };
  let active = null;
  function dismiss() {
    panel.hidden = true;
    if (active) { active.setAttribute('aria-expanded','false'); active.focus(); }
    active = null;
  }
  root.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => {
    if (active === button) { dismiss(); return; }
    if (active) active.setAttribute('aria-expanded','false');
    active = button;
    const key = button.dataset.open;
    const [title, items] = contents[key];
    panel.dataset.panel = key;
    panel.querySelector('.panel-title').textContent = title;
    const rows = items.map(([name, value]) => {
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('span');
      const detail = document.createElement('b');
      label.textContent = name; detail.textContent = value;
      row.append(label, detail);
      return row;
    });
    panel.querySelector('.rows').replaceChildren(...rows);
    button.setAttribute('aria-expanded','true');
    panel.hidden = false;
    close.focus();
  }));
  close.addEventListener('click', dismiss);
  root.addEventListener('keydown', event => {
    if (event.key === 'Escape' && active) dismiss();
  });
})();
</script>
