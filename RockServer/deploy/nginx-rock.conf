server {
    listen 80;
    listen [::]:80;
    server_name rock.glowsoft.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rock.glowsoft.ru;

    ssl_certificate /etc/letsencrypt/live/rock.glowsoft.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rock.glowsoft.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log off;

    # Release metadata and channel aliases change when a release is promoted.
    # These files are published separately from the embedded Go website.
    location = /mac/appcast.xml {
        alias /var/www/rocknroll/releases/appcast.xml;
        default_type application/xml;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /mac/latest.json {
        alias /var/www/rocknroll/releases/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /mac/stable/latest.dmg {
        alias /var/www/rocknroll/releases/stable/latest.dmg;
        default_type application/x-apple-diskimage;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition 'attachment; filename="RockNRoll.dmg"';
    }
    location = /mac/beta/latest.dmg {
        alias /var/www/rocknroll/releases/beta/latest.dmg;
        default_type application/x-apple-diskimage;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition 'attachment; filename="RockNRoll-Beta.dmg"';
    }
    # Only immutable, versioned Apple Silicon disk images are exposed here.
    location ~ ^/mac/releases/(?<mac_release>RockNRoll-[A-Za-z0-9._-]+-arm64\.dmg)$ {
        alias /var/www/rocknroll/releases/releases/$mac_release;
        default_type application/x-apple-diskimage;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment";
    }
    location /mac/ {
        return 404;
    }

    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:7878;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
