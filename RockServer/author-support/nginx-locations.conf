    # Author support: static signed catalog and loopback-only claims registry.
    location = /author-support/catalog.json {
        alias /var/www/rocknroll/author-support/catalog.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /author-support/ {
        client_max_body_size 1k;
        client_body_timeout 5s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:18792;
    }
