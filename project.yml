name: ConferenceGuest
options:
  bundleIdPrefix: dev.vsmirn0v
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  JazzSDK:
    url: https://github.com/salute-developers/jazz-ios-sdk.git
    revision: 6d5f92869690fa22bb489a9089aa554d733c6936
  ConferenceCore:
    path: ConferenceCore
targets:
  ConferenceGuest:
    type: application
    platform: iOS
    sources:
      - path: ConferenceGuest
    dependencies:
      - package: JazzSDK
      - package: ConferenceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest
        INFOPLIST_FILE: ConferenceGuest/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        JOIN_LINK_HOST: ""
    postBuildScripts:
      - name: Copy provider SDK resources
        script: bash "$PROJECT_DIR/scripts/copy-sdk-resources.sh"
        basedOnDependencyAnalysis: false
