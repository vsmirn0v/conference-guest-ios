name: RockNRoll
options:
  developmentLanguage: en
  knownRegions: [en, ru, es, ar, hi, fr, de, zh-Hans, id]
  bundleIdPrefix: dev.vsmirn0v
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ConferenceCore:
    path: ConferenceCore
  MeetingEngine:
    path: MeetingEngine
  LiveKit:
    path: .build/unified-sdk-dependencies/client-sdk-swift
  NativeWebRTC:
    path: .build/unified-sdk-dependencies/webrtc-xcframework
  MLXAudioVoice:
    path: Dependencies/MLXAudioVoice
targets:
  RockNRoll:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - RockNRollUITests
        - RockNRollTests
    sources:
      - path: RockNRoll
      - path: Dependencies/MLXAudioVoice/LICENSE
        buildPhase: resources
      - path: Shared/BroadcastLifecycle.swift
      - path: Shared/LocalSharePreviewTransport.swift
      - path: Shared/OutgoingShareExperiment.swift
      - path: Shared/OutgoingVideoCadence.swift
      - path: Shared/NativeGuestCompanionProtocol.swift
      - path: Shared/SharedTextSnapshot.swift
      - path: Shared/MeetingActivityState.swift
      - path: Shared/MeetingActivityViews.swift
      - path: Shared/DiagnosticsStore.swift
    dependencies:
      - package: ConferenceCore
      - package: MeetingEngine
      - package: LiveKit
      - package: NativeWebRTC
        product: LiveKitWebRTC
      - package: MLXAudioVoice
        product: MLXAudioTTS
      - package: MLXAudioVoice
        product: MLXAudioCore
      - target: RockBroadcast
      - target: MeetingActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest
        INFOPLIST_FILE: RockNRoll/Info.plist
        CODE_SIGN_ENTITLEMENTS: RockNRoll/App.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5V64BP2H3P
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        JOIN_LINK_HOST: ""
      configs:
        Debug:
          CLOUDKIT_ENVIRONMENT: Development
        Release:
          CLOUDKIT_ENVIRONMENT: Production
  RockBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: RockBroadcast
    dependencies:
      - package: LiveKit
      - package: NativeWebRTC
        product: LiveKitWebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest.broadcast
        INFOPLIST_FILE: RockBroadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: RockBroadcast/Extension.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5V64BP2H3P
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
  MeetingActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeetingActivity
      - path: Shared/MeetingActivityState.swift
      - path: Shared/MeetingActivityViews.swift
    dependencies:
      - package: ConferenceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest.activity
        INFOPLIST_FILE: MeetingActivity/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5V64BP2H3P
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  RockNRollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RockNRollTests
      - path: Experiments/VP9Hardware/FixtureSupport.swift
    dependencies:
      - target: RockNRoll
      - package: ConferenceCore
      - package: MeetingEngine
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5V64BP2H3P
  RockNRollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RockNRollUITests
    dependencies:
      - target: RockNRoll
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5V64BP2H3P
