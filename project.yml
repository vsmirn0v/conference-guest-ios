name: RockNRoll
options:
  bundleIdPrefix: dev.vsmirn0v
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  JazzSDK:
    url: https://github.com/salute-developers/jazz-ios-sdk.git
    revision: 6d5f92869690fa22bb489a9089aa554d733c6936
  ConferenceCore:
    path: ConferenceCore
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    revision: f07831a7f06bca9e2fc2e136db591b7b42f16d8d
targets:
  RockNRoll:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - RockNRollUITests
    sources:
      - path: RockNRoll
    dependencies:
      - package: JazzSDK
      - package: ConferenceCore
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest
        INFOPLIST_FILE: RockNRoll/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5V64BP2H3P
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        JOIN_LINK_HOST: ""
    postBuildScripts:
      - name: Copy provider SDK resources
        script: bash "$PROJECT_DIR/scripts/copy-sdk-resources.sh"
        basedOnDependencyAnalysis: false
  RockNRollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RockNRollUITests
    dependencies:
      - target: RockNRoll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5V64BP2H3P
