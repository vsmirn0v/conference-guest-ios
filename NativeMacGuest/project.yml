name: RockNativeGuest
options:
  developmentLanguage: en
  knownRegions: [en, ru, es, ar, hi, fr, de, zh-Hans, id]
  deploymentTarget:
    macOS: '13.0'
packages:
  ConferenceCore:
    path: ../ConferenceCore
  MeetingEngine:
    path: ../MeetingEngine
  LiveKit:
    path: ../.build/unified-sdk-dependencies/client-sdk-swift
  NativeWebRTC:
    path: ../.build/unified-sdk-dependencies/webrtc-xcframework
  SherpaOnnxKit:
    path: ../Dependencies/SherpaOnnxKit
  MLXAudioVoice:
    path: ../Dependencies/MLXAudioVoice
targets:
  RockNRollNativeGuest:
    type: application
    platform: macOS
    scheme:
      testTargets: [NativeDesktopTests]
    sources:
      - path: .
        # These diagnostic harnesses target experiment-only test hooks and helper
        # types that have not landed. Exclude them until their dependencies are tracked;
        # no production code references either harness.
        excludes: ['*.yml', '*.py', '**/*.py', '*.md', '*.sh', Tests, __pycache__, '**/__pycache__',
                   NativeGuest.entitlements, Info.plist, Package.resolved, AuthorSupport/SupportLanguage.bundle,
                   MicrophoneActivationExperiment.swift, AcousticValidationExperiment.swift,
                   StartupCaptureReceiver.swift, VoiceWorker, VoiceGPUWorker, ThirdPartyNotices]
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
      - path: ../Dependencies/MLXAudioVoice/LICENSE
        buildPhase: resources
      - path: ../Shared/NativeGuestCompanionProtocol.swift
      - path: ../Shared/SharedTextSnapshot.swift
      - path: ../Shared/DiagnosticsStore.swift
      - path: ../RockNRoll/RoomHistoryStore.swift
      - path: ../RockNRoll/RoomSyncCoordinator.swift
      - path: ../RockNRoll/RoomSyncSettingsView.swift
      - path: ../RockNRoll/CloudRoomTransport.swift
      - path: ../RockNRoll/AppleCalendarReader.swift
      - path: ../RockNRoll/CalendarMeetingStore.swift
      - path: ../RockNRoll/CalendarInvitationContext.swift
      - path: ../RockNRoll/CalendarReminderRepository.swift
      - path: ../RockNRoll/CalendarReminderCoordinator.swift
      - path: ../RockNRoll/CalendarReminderNotifications.swift
      - path: ../RockNRoll/ReminderProfileCloud.swift
      - path: ../RockNRoll/MeetingContinuationCloud.swift
      - path: ../RockNRoll/MeetingContinuationCoordinator.swift
      - path: ../RockNRoll/MeetingSetupCoordinator.swift
      - path: ../RockNRoll/HomeMeetingCard.swift
      - path: ../RockNRoll
        includes: ['**/Localizable.strings', '**/Localizable.stringsdict']
        buildPhase: resources
    dependencies:
      - package: ConferenceCore
      - package: MeetingEngine
      - package: LiveKit
      - package: NativeWebRTC
        product: LiveKitWebRTC
      - package: SherpaOnnxKit
      - target: RockClonedVoiceWorker
        embed: true
        codeSign: true
        link: false
        copy:
          destination: executables
      - target: RockClonedVoiceGPUWorker
        embed: true
        codeSign: true
        link: false
        copy:
          destination: executables
    postBuildScripts:
      - name: Bundle MLX Metal library
        script: |
          set -eu
          src="${BUILT_PRODUCTS_DIR}/mlx-swift_Cmlx.bundle"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/mlx-swift_Cmlx.bundle"
          test -f "${src}/Contents/Resources/default.metallib"
          /usr/bin/ditto "${src}" "${dest}"
        inputFiles:
          - "${BUILT_PRODUCTS_DIR}/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib"
        outputFiles:
          - "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib"
        basedOnDependencyAnalysis: true
    settings:
      configs:
        Debug:
          CLOUDKIT_ENVIRONMENT: Development
          APS_ENVIRONMENT: development
        Release:
          CLOUDKIT_ENVIRONMENT: Production
          APS_ENVIRONMENT: production
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          COPY_PHASE_STRIP: YES
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest.nativeguest
        PRODUCT_NAME: Rock'N'Roll for Mac
        EXECUTABLE_NAME: RockNRoll Native Guest
        PRODUCT_MODULE_NAME: RockNativeDesktop
        DEVELOPMENT_TEAM: 5V64BP2H3P
        CODE_SIGN_STYLE: Automatic
        REGISTER_APP_GROUPS: YES
        CODE_SIGN_ENTITLEMENTS: NativeGuest.entitlements
        SWIFT_VERSION: '5.0'
        SWIFT_OBJC_BRIDGING_HEADER: NativeGuest-Bridging-Header.h
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NativeGuestProtocolVersion: '1'
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Share your camera when you turn video on in the native guest preview.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Share your microphone when you unmute in the native guest preview.
        ENABLE_HARDENED_RUNTIME: YES
        # The on-device judge's and the cloned voice's frameworks exist only on newer macOS; the app still runs on 13.
        OTHER_LDFLAGS: ['$(inherited)', '-weak_framework', 'FoundationModels', '-weak_framework', 'Translation', '-weak_framework', 'CoreAI']
        ONLY_ACTIVE_ARCH: YES
        ARCHS: arm64
  RockClonedVoiceWorker:
    type: tool
    platform: macOS
    sources:
      - path: VoiceWorker/Main.swift
      - path: Attention/VoxCPM2
      - path: Attention/ClonedVoiceWire.swift
      - path: Attention/VoiceStorage.swift
      - path: Attention/ProcessMemoryProbe.swift
    dependencies:
      - package: ConferenceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest.nativeguest.voice-worker
        DEVELOPMENT_TEAM: 5V64BP2H3P
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_CODE_SIGN_FLAGS: '$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)'
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: '5.0'
        OTHER_LDFLAGS: ['$(inherited)', '-weak_framework', 'CoreAI']
        ARCHS: arm64
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: VoiceWorker/Worker.entitlements
          # The codec and tensor operations are CPU-heavy even when inference uses
          # the Neural Engine. Keep Debug worker latency representative of Release.
          SWIFT_OPTIMIZATION_LEVEL: '-O'
          SWIFT_COMPILATION_MODE: wholemodule
        Release:
          CODE_SIGN_ENTITLEMENTS: VoiceWorker/Worker.entitlements
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
  RockClonedVoiceGPUWorker:
    type: tool
    platform: macOS
    deploymentTarget: '27.0'
    sources:
      - path: VoiceGPUWorker/Main.swift
      - path: Attention/VoxCPM2
      - path: Attention/ClonedVoiceWire.swift
      - path: Attention/VoiceStorage.swift
      - path: Attention/ProcessMemoryProbe.swift
    dependencies:
      - package: ConferenceCore
      - package: MLXAudioVoice
        product: MLXAudioTTS
      - package: MLXAudioVoice
        product: MLXAudioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest.nativeguest.gpu-voice-worker
        DEVELOPMENT_TEAM: 5V64BP2H3P
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CODE_SIGN_ENTITLEMENTS: VoiceWorker/Worker.entitlements
        OTHER_CODE_SIGN_FLAGS: '$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)'
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: '5.0'
        OTHER_LDFLAGS: ['$(inherited)', '-weak_framework', 'CoreAI']
        ARCHS: arm64
      configs:
        Release:
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
  NativeDesktopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Parity
    dependencies:
      - target: RockNRollNativeGuest
      - package: ConferenceCore
      - package: MeetingEngine
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.conferenceguest.nativeguest.tests
        DEVELOPMENT_TEAM: 5V64BP2H3P
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Rock'N'Roll for Mac.app/Contents/MacOS/RockNRoll Native Guest
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: '5.0'
        OTHER_LDFLAGS: ['$(inherited)', '-weak_framework', 'FoundationModels', '-weak_framework', 'Translation', '-weak_framework', 'CoreAI']
