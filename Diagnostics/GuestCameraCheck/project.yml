name: CameraCheck
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  GuestSDK:
    url: https://github.com/salute-developers/jazz-ios-sdk.git
    revision: 6d5f92869690fa22bb489a9089aa554d733c6936
settings:
  base:
    DEVELOPMENT_TEAM: 5V64BP2H3P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
targets:
  CameraCheck:
    type: application
    platform: iOS
    sources:
      - Check.swift
      - PeerCheck.swift
      - ../../RockNRoll/VendorIntegration/GuestCameraOrientation.swift
      - ../../RockNRoll/VendorIntegration/GuestCameraTrackBinding.swift
      - ../../RockNRoll/VendorIntegration/GuestH264ColorEncoder.swift
      - ../../RockNRoll/VendorIntegration/GuestCameraFrameDelegate.swift
      - ../../RockNRoll/VendorIntegration/H264ColorSignalling.swift
      - ../../RockNRoll/H264InputColorSignalling.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vsmirn0v.camera-check
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Local camera geometry qualification.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: GuestSDK
        product: JazzSDK
    postBuildScripts:
      - name: Embed missing vendor runtime
        script: |
          sdk_checkout="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/jazz-ios-sdk"
          ditto "$sdk_checkout/Sources/Spench.xcframework/ios-arm64/Spench.framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Spench.framework"
          chmod -R u+w "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Spench.framework"
          codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Spench.framework"
